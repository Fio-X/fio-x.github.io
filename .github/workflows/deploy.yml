name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  # Pull requests run the same checks and build, but never deploy.
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        # No static_site_generator: it writes its own next.config.js, which Next.js loads
        # before next.config.ts and which drops trailingSlash (every /section/ URL 404s).
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate content
        run: bun run blog -- validate

      - name: Test
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      # trailingSlash export layout: links point to /news/, so news/index.html must exist.
      - name: Verify export layout
        run: test -f out/news/index.html && test -f out/information/index.html && test ! -e next.config.js

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
