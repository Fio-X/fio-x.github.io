<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fio — Source-aligned desktop content review</title>

  <!-- Audit-only: the reference site loads Adobe Garamond from this hosted
       stylesheet. It is not copied into the production project. -->
  <link rel="stylesheet" href="https://fast.fonts.net/cssapi/e5a7edfc-453a-4658-b219-9c1e4c40f48f.css">

  <style>
    :root {
      --paper: #eaeeee;
      --ink: #000;
      --muted: #777;
      --rule: #999;
      --sidebar: 360px;
      --serif: "Adobe Garamond W01", "游明朝体", "Yu Mincho", YuMincho,
        "ヒラギノ明朝 Pro", "Hiragino Mincho Pro", "MS P明朝", "MS PMincho", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    /* The source theme reset. */
    html,
    body,
    div,
    span,
    h1,
    h2,
    h3,
    p,
    ul,
    ol,
    li,
    header,
    main,
    nav,
    footer,
    section,
    article,
    figure,
    blockquote,
    a {
      margin: 0;
      padding: 0;
      border: 0;
      outline: 0;
      font-size: 100%;
      vertical-align: baseline;
      background: transparent;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 1100px;
      min-height: 600px;
      margin: 0;
      padding: 0;
      background: var(--paper);
    }

    body {
      color: var(--ink);
      font-family: var(--serif);
      font-size: 62.5%;
      font-weight: 400;
      line-height: 1.4em;
      overflow-wrap: break-word;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    img {
      max-width: 100%;
      height: auto;
      border: 0;
      outline: 0;
    }

    h1,
    h2,
    h3 {
      width: auto;
      font-weight: 400;
    }

    h1 {
      font-size: 28px;
      line-height: 1.4em;
    }

    h2 {
      font-size: 22px;
      line-height: 1.4em;
    }

    h3 {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4em;
    }

    p,
    th,
    td {
      font-size: 14px;
      line-height: 1.6em;
    }

    p.year,
    p.category,
    p.spec,
    p.date,
    p.day {
      color: var(--muted);
    }

    ul,
    ol {
      list-style: none;
    }

    a,
    a:visited,
    a:active {
      color: var(--ink);
      text-decoration: none;
    }

    a:hover {
      color: var(--muted);
      text-decoration: none;
    }

    .cf::after {
      display: table;
      clear: both;
      content: "";
    }

    /* Review UI is outside the recreated site chrome. */
    .review-bar {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 30000;
      padding: 8px 10px;
      border: 1px solid #bbb;
      background: #f7f8f5;
      color: #333;
      font: 11px/1.3 var(--sans);
    }

    .review-bar select {
      margin-left: 6px;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
    }

    .review-clean .review-bar {
      display: none;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Header / nav: this mirrors .header, .header-inner, .pc-nav,
       .nav-inner-01 and .nav-inner-02 in the source theme. */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 20000;
      width: var(--sidebar);
      height: 100%;
      background: var(--paper);
    }

    .header-inner {
      position: absolute;
      top: 50px;
      left: 50px;
    }

    .logo {
      position: relative;
      z-index: 101;
      text-align: left;
    }

    .logo h1 {
      font-size: 15px;
      font-weight: 400;
      line-height: 1em;
    }

    .nav {
      position: relative;
      margin-top: 40px;
    }

    .pc-nav {
      display: block;
    }

    .nav-inner-01 {
      float: left;
      margin-right: 40px;
    }

    .nav-inner-02 {
      float: left;
    }

    .main-nav li,
    .sub-nav li {
      position: relative;
      padding: 4px 0;
      font-size: 14px;
    }

    .main-nav li.jpt,
    .sub-nav li.jpt {
      font-size: 12px;
    }

    .sub-nav li.video-works {
      margin-top: 1.6em;
    }

    .sub-nav li.original-last {
      margin-bottom: 1.6em;
    }

    .sub-nav li a,
    .news-item a,
    .page-inner a {
      color: var(--muted);
    }

    .sub-nav li a:hover,
    .news-item a:hover,
    .page-inner a:hover {
      color: var(--ink);
    }

    .page-inner a .item-inner {
      color: var(--ink);
    }

    .page-inner a .item-inner:hover {
      color: var(--muted);
    }

    .main-nav li.current-menu-item::before,
    .sub-nav li.current-menu-item::before,
    .sub-nav li.m-news::before,
    .sub-nav li.m-information::before {
      display: inline-block;
      position: absolute;
      top: 50%;
      left: -1em;
      width: 4px;
      height: 4px;
      margin: 0 5px;
      border-radius: 2px;
      background: var(--ink);
      content: "";
      line-height: 1em;
      transform: translateY(-50%);
    }

    .sub-nav li.current-menu-item::before,
    .sub-nav li.m-news::before,
    .sub-nav li.m-information::before {
      background: var(--muted);
    }

    .lang-nav {
      margin-top: 40px;
    }

    .lang-nav li {
      display: inline-block;
    }

    .lang-nav li:nth-of-type(2n)::before {
      padding: 3px;
      content: " / ";
      font-size: 14px;
    }

    .lang-nav li a {
      padding: 3px 0;
      font-size: 13px;
    }

    /* Page / content width. base.js sets the wide desktop width to
       viewport-height - 36px and the <=1365px desktop width to 68%. */
    .page-main {
      width: auto;
      height: auto;
      margin: 18px 18px 0;
      padding-bottom: 18px;
    }

    .page-inner {
      float: right;
      width: calc(100vh - 36px);
    }

    .contents {
      width: 100%;
    }

    /* News: source order is image, then text, then a 15px section rule. */
    .news-text,
    .news-img {
      margin-top: 1em;
    }

    .news-img-inner,
    .prototype-image {
      display: block;
    }

    .prototype-image {
      display: block;
      max-width: 100%;
      height: auto;
    }

    img.post-img {
      max-height: 257px;
      width: auto;
    }

    .visual-sun {
      background:
        radial-gradient(circle at 56% 36%, #fffbd9 0 12%, transparent 13%),
        linear-gradient(135deg, #b9c5ca, #748d83);
    }

    .visual-ochre {
      background:
        radial-gradient(ellipse at 45% 60%, #d3a36f 0 14%, transparent 15%),
        linear-gradient(135deg, #d6ddd5, #9a806a);
    }

    .visual-blue {
      background:
        linear-gradient(155deg, transparent 0 48%, #d9e3e4 49% 62%, transparent 63%),
        linear-gradient(35deg, #718c95, #bfcfca);
    }

    .visual-rose {
      background:
        radial-gradient(circle at 50% 48%, #d59b93 0 20%, transparent 21%),
        linear-gradient(135deg, #e0d4c8, #99a7a2);
    }

    .visual-graphite {
      background:
        linear-gradient(110deg, #202b2d 0 35%, #cad3ca 36% 63%, #8b9c94 64%);
    }

    .section-line {
      display: inline-block;
      width: 15px;
      height: 1px;
      margin: 3em 0 2em;
      border: 0;
      background: var(--rule);
      transform: translateY(-50%);
    }

    .section-line:last-of-type {
      height: 0;
      margin: 0;
    }

    .page-numbers-nav {
      position: relative;
      display: block;
      margin-top: 5em;
    }

    .page-numbers li {
      display: inline-block;
      padding-right: 0.5em;
      font-size: 14px;
      letter-spacing: 0;
    }

    .page-numbers li .current {
      color: var(--ink);
    }

    /* Biography / Contact lists. */
    .list-set {
      margin-bottom: 4em;
      padding-top: 18px;
    }

    .list-set:first-of-type {
      padding-top: 0;
    }

    .list-set:last-of-type {
      margin-bottom: 0;
    }

    .list-title p {
      margin-bottom: 0.3em;
      font-size: 16px;
      font-weight: 700;
    }

    .list-text {
      display: table;
      border-collapse: collapse;
    }

    .cell-box {
      display: table-row;
    }

    .biography-contents .cell-01,
    .biography-contents .cell-02 {
      display: table-cell;
      padding: 0;
      vertical-align: top;
    }

    .biography-contents .cell-01 {
      width: 60px;
      padding-right: 5px;
    }

    .list-text p {
      line-height: 1.8em;
    }

    /* Works: one full-width item stream, separated project/video sections. */
    .works-contents .item,
    .video_works-contents .item,
    .installation_views-contents .item {
      margin-bottom: 5em;
    }

    .works-contents .item:last-of-type,
    .video_works-contents .item:last-of-type,
    .installation_views-contents .item:last-of-type {
      margin-bottom: 0;
    }

    .works-contents .item-text,
    .video_works-contents .item-text,
    .installation_views-contents .item-text {
      margin-top: 1em;
    }

    .works-contents h1.title {
      font-size: 14px;
      line-height: 1.4em;
    }

    .works-img {
      display: block;
      width: 100%;
    }

    .project-contents {
      margin-top: 8em;
      padding-top: 12em;
      border-top: 1px solid var(--rule);
    }

    .video-contents {
      margin-top: 8em;
      margin-bottom: 5em;
      padding-top: 12em;
      border-top: 1px solid var(--rule);
    }

    .installation-contents {
      margin: 0;
    }

    /* Publications / Articles: source uses inline-table, 31% / 3.5%, and
       deliberately leaves the default baseline alignment intact. */
    .archive-inner .publications-contents,
    .archive-inner .articles-contents {
      font-size: 0;
    }

    .archive-inner .publications-contents .item,
    .archive-inner .articles-contents .item {
      display: inline-table;
      width: 31%;
      margin-right: 3.5%;
      margin-bottom: 7%;
      font-size: 10px;
    }

    .archive-inner .publications-contents .item:nth-of-type(3n),
    .archive-inner .articles-contents .item:nth-of-type(3n) {
      margin-right: 0;
    }

    .archive-inner .publications-contents .item a,
    .archive-inner .articles-contents .item a {
      position: relative;
      display: block;
    }

    .item-image {
      display: block;
    }

    .archive-inner .publications-contents .item-image img {
      display: block;
      width: auto;
      max-width: 100%;
      height: auto;
    }

    .archive-inner .articles-contents .item-image img {
      display: block;
      width: 75%;
      max-width: 75%;
      height: auto;
    }

    .archive-inner .publications-contents .item-text,
    .archive-inner .articles-contents .item-text {
      margin-top: 1em;
    }

    .archive-inner .publications-contents h1.title,
    .archive-inner .articles-contents h1.title {
      font-size: 14px;
      line-height: 1.4em;
    }

    /* Single work / publication review pages keep the source content order. */
    .works-single-contents .item-text {
      display: none;
      margin-bottom: 18px;
    }

    .works-single-contents .item-inner {
      margin-bottom: 18px;
    }

    .works-single-contents .item-inner:last-of-type {
      margin-bottom: 0;
    }

    .media-image {
      display: block;
      width: 100%;
      background: #c7cfcc;
    }

    .media-image.landscape { aspect-ratio: 3 / 2; }
    .media-image.portrait { aspect-ratio: 2 / 3; }

    .media-pair {
      display: flex;
      gap: 2%;
    }

    .media-pair .media-item {
      width: 49%;
    }

    .publication-slider {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 2;
      overflow: hidden;
      background: #b8c5c2;
    }

    .publication-slider .slide {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 60% 36%, #f0e4b5 0 12%, transparent 13%),
        linear-gradient(135deg, #7d958e, #c7d2ca 48%, #877d76);
    }

    .publication-slider .slide:nth-child(2) {
      inset: 12% 10%;
      opacity: .72;
      background:
        linear-gradient(150deg, transparent 0 45%, #dfcdbf 46% 64%, transparent 65%),
        #9caaa4;
    }

    .slider-hint {
      position: absolute;
      right: 12px;
      bottom: 10px;
      color: #fff;
      font: 11px/1.3 var(--sans);
      letter-spacing: .04em;
    }

    .publications-single-contents .item-text {
      margin-top: 6em;
    }

    .publications-single-contents .item-text h1.title {
      font-size: 18px;
      line-height: 1.4em;
    }

    .description {
      margin-top: 3em;
    }

    .description p + p {
      margin-top: 1.6em;
    }

    /* Information article templates. The index and essay/conversation keep
       Ueda's narrow reading measure; image notes open the media track while
       retaining Kawauchi's image-to-caption rhythm. Every media block is a
       replaceable prototype slot, not a reference-site asset. */
    .information-contents,
    .information-article {
      width: 100%;
    }

    .information-index,
    .information-article.narrow {
      width: 580px;
      max-width: 100%;
    }

    .information-index h1.title,
    .information-article h1.title {
      font-size: 18px;
      font-weight: 400;
      line-height: 1.35em;
    }

    .information-index .index-intro,
    .information-article .article-lead {
      margin-top: 2em;
      font-size: 16px;
      line-height: 1.8em;
    }

    .information-entry {
      margin-top: 6em;
    }

    .information-entry + .information-entry {
      margin-top: 5em;
    }

    .information-meta,
    .information-entry .entry-type,
    .information-entry .entry-template {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6em;
    }

    .information-entry h2 {
      margin-top: 0.3em;
      font-size: 18px;
      font-weight: 400;
      line-height: 1.35em;
    }

    .information-entry p.entry-summary {
      margin-top: 1em;
      font-size: 13px;
      line-height: 1.8em;
    }

    .information-entry a.entry-link {
      display: inline-block;
      margin-top: 1.2em;
      color: var(--muted);
      font-size: 13px;
    }

    .information-entry a.entry-link:hover {
      color: var(--ink);
    }

    .information-article {
      font-size: 13px;
      line-height: 24px;
    }

    .information-article .article-head {
      margin-bottom: 4em;
    }

    .information-article .article-kicker {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6em;
    }

    .information-article .article-date {
      margin-top: 0.2em;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6em;
    }

    .information-article h1.title {
      margin-top: 0.25em;
    }

    .information-article .article-body {
      margin-top: 4em;
    }

    .information-article .article-body h2 {
      margin: 4em 0 1.6em;
      font-size: 18px;
      font-weight: 400;
      line-height: 24px;
    }

    .information-article .article-body p {
      font-size: 13px;
      line-height: 24px;
    }

    .information-article .article-body p + p {
      margin-top: 24px;
    }

    .information-article .article-body blockquote {
      margin: 3em 0;
      padding-left: 60px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.8em;
    }

    .template-media {
      margin: 0;
    }

    .template-image {
      display: block;
      width: 100%;
      min-height: 240px;
      background-color: #c7cfcc;
    }

    .template-image.hero {
      aspect-ratio: 16 / 10;
    }

    .template-image.image-note {
      aspect-ratio: 3 / 2;
    }

    .template-image.image-note-tall {
      aspect-ratio: 4 / 5;
    }

    .template-caption {
      margin-top: 0.8em;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6em;
    }

    .information-article.image-notes {
      width: 720px;
      max-width: 100%;
    }

    .information-article.image-notes .article-head {
      width: 580px;
      max-width: 100%;
    }

    .image-note-item {
      margin-bottom: 5em;
    }

    .image-note-item:last-child {
      margin-bottom: 0;
    }

    .image-note-item .note-copy {
      width: 580px;
      max-width: 100%;
      margin-top: 1.2em;
    }

    .information-article.conversation .conversation-list {
      margin-top: 4em;
    }

    .conversation-row {
      display: table;
      width: 100%;
      margin-top: 2em;
    }

    .conversation-speaker,
    .conversation-answer {
      display: table-cell;
      vertical-align: top;
    }

    .conversation-speaker {
      width: 70px;
      color: var(--muted);
      font-size: 13px;
      line-height: 24px;
    }

    .conversation-answer {
      font-size: 13px;
      line-height: 24px;
    }

    .conversation-answer p + p {
      margin-top: 24px;
    }

    .information-back {
      display: inline-block;
      margin-top: 6em;
      color: var(--muted);
      font-size: 13px;
    }

    .spec-set {
      margin-top: 6em;
      margin-bottom: 5em;
    }

    .spec-row {
      display: table;
      width: 100%;
    }

    .spec-label,
    .spec-value {
      display: table-cell;
      padding: 5px 5px 5px 0;
      vertical-align: top;
    }

    .spec-label {
      width: 120px;
      color: var(--muted);
    }

    .footer {
      position: fixed;
      bottom: 18px;
      left: 50px;
      z-index: 30000;
    }

    .copy {
      float: left;
      margin-right: 30px;
      font-size: 13px;
    }

    @media only screen and (max-width: 1365px) {
      .page-inner {
        width: 68%;
      }
    }
  </style>
</head>
<body>
  <div class="review-bar">
    <strong>Desktop source-aligned review</strong>
    <label>
      <span class="sr-only">View</span>
      <select id="view-select" aria-label="Choose review page">
        <option value="news">News</option>
        <option value="news-2">News / page 2</option>
        <option value="biography">Biography</option>
        <option value="works">Works</option>
        <option value="work-detail">Works detail</option>
        <option value="publications">Publications</option>
        <option value="publications-2">Publications / page 2</option>
        <option value="publication-detail">Publication detail</option>
        <option value="articles">Articles</option>
        <option value="information">Information / entries</option>
        <option value="information-essay">Information / Essay template</option>
        <option value="information-image-notes">Information / Image Notes template</option>
        <option value="information-conversation">Information / Conversation template</option>
        <option value="contact">Contact</option>
      </select>
    </label>
  </div>

  <header class="header">
    <div class="header-inner cf">
      <div class="logo">
        <h1><a href="#news">Fio</a></h1>
      </div>
      <nav id="desktop-nav" class="nav pc-nav cf"></nav>
    </div>
  </header>

  <main id="app" class="main page-main cf"></main>

  <footer class="footer">
    <p class="copy">© 2026 Fio</p>
  </footer>

  <script>
    const viewSelect = document.querySelector('#view-select');
    const app = document.querySelector('#app');
    const nav = document.querySelector('#desktop-nav');

    const pageNames = {
      news: 'News',
      'news-2': 'News',
      biography: 'Biography',
      works: 'Works',
      'work-detail': 'Works',
      publications: 'Publications',
      'publications-2': 'Publications',
      'publication-detail': 'Publications',
      articles: 'Articles',
      information: 'Information',
      'information-essay': 'Information',
      'information-image-notes': 'Information',
      'information-conversation': 'Information',
      contact: 'Contact'
    };

    const subNavigation = {
      news: [
        ['All', 'news', 'm-news'],
        ['Event', 'news'],
        ['Group Exhibition', 'news'],
        ['News', 'news'],
        ['Publication', 'news'],
        ['Solo Exhibition', 'news']
      ],
      biography: [
        ['Fio profile', 'biography', '', 'rinko-kawauchi'],
        ['Selected Solo Exhibitions', 'biography', '', 'solo-exhibitions'],
        ['Selected Group Exhibitions', 'biography', '', 'group-exhibitions'],
        ['Awards', 'biography', '', 'awards'],
        ['Publications', 'biography', '', 'publications'],
        ['Major Public Collections', 'biography', '', 'collection']
      ],
      works: [
        ['Window Study', 'works'],
        ['Soft Orbit', 'works'],
        ['Field / Weather', 'works', 'jpt'],
        ['Ambient Measure', 'works'],
        ['Small Chorus', 'works'],
        ['The Near, The Far', 'works'],
        ['Aerial Room', 'works'],
        ['Ember Notes', 'works', 'jpt'],
        ['Still Sleep', 'works', 'jpt original-last'],
        ['Ridge Line', 'works'],
        ['Four Percent', 'works'],
        ['The River Receives', 'works', 'jpt'],
        ['Search for Daylight', 'works'],
        ['Soft Flock', 'works'],
        ['Planting / Passing', 'works', 'jpt'],
        ['Moving Works', 'works', 'video-works'],
        ['Spatial Views', 'works', 'installation-views']
      ],
      articles: [
        ['Essay', 'articles'],
        ['Interview', 'articles'],
        ['Commission', 'articles']
      ],
      information: [
        ['All entries', 'information', 'm-information', 'information'],
        ['Essay', 'information', '', 'information-essay', 'information-essay'],
        ['Image Notes', 'information', '', 'information-image-notes', 'information-image-notes'],

      const sub = subItems.map(([label, target, classes = '', anchor = '', subPage = '']) => {

    function visual(classes, label) {

        classes.includes('template-hero') ? [1200, 750] :

        classes.includes('template-note-tall') ? [800, 1000] :
        classes.includes('pub-a') ? [180, 252] :
        classes.includes('pub-b') ? [220, 280] :
        classes.includes('pub-c') ? [220, 197] :
        classes.includes('pub-d') ? [225, 285] :
        classes.includes('pub-e') ? [158, 216] :
        classes.includes('pub-f') ? [210, 285] :
        classes.includes('pub-g') ? [105, 148] :
        classes.includes('pub-h') ? [203, 254] :

        classes.includes('article-a') ? [600, 847] :

        classes.includes('article-d') ? [600, 751] :
        classes.includes('article-e') ? [600, 849] :
        classes.includes('article-f') ? [600, 783] : [600, 400];
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + ratio[0] + '" height="' + ratio[1] + '" viewBox="0 0 ' + ratio[0] + ' ' + ratio[1] + '" preserveAspectRatio="none"><rect width="100%" height="100%" fill="#c7cfcc"/></svg>';
      const src = 'data:image/svg+xml,' + encodeURIComponent(svg);
      const intrinsic = classes.includes('pub-') || classes.includes('works-img') || classes.includes('template-') ?
        ' width="' + ratio[0] + '" height="' + ratio[1] + '"' : '';
      return '<img class="prototype-image ' + classes + '"' + intrinsic + ' src="' + src + '" alt="' + label + '">';

      nav.innerHTML = navigationMarkup(page);
      const archive = page === 'works' || page === 'publications' || page === 'publications-2' || page === 'articles';
      const single = page === 'work-detail' || page === 'publication-detail';
      app.className = 'main page-main cf' + (archive ? ' archive-main' : '') + (single ? ' single-main' : '');
      app.innerHTML = '<div class="inner page-inner' + (archive ? ' archive-inner' : '') + (single ? ' single-inner' : '') + ' cf">' + pageContent(page) + '</div>';
      viewSelect.value = page;
      document.body.classList.toggle('review-clean', new URLSearchParams(location.search).has('clean'));
      document.title = 'Fio — ' + pageNames[page] + ' source-aligned desktop review';
    }

    viewSelect.addEventListener('change', event => {
      location.hash = event.target.value;
    });

    window.addEventListener('hashchange', render);
    render();
  </script>
</body>
</html>
